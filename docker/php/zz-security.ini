; Mitigação da CVE-2026-115560 (aviso do provedor da VPS, 2026-10-23): sem
; correção do PHP, o upload progress de sessão fica desligado. Só afeta barras
; de progresso de upload baseadas em sessão PHP — o Laravel não usa.
; Copiado para conf.d na imagem (Dockerfile); o `zz-` garante que carrega por
; último e ganha de qualquer ini anterior.
session.upload_progress.enabled = Off
