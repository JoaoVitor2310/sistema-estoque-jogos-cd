# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name carcadeals.com www.carcadeals.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name carcadeals.com www.carcadeals.com;
    root /var/www/html/public;

    ssl_certificate     /etc/letsencrypt/live/carcadeals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carcadeals.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Nome literal em `fastcgi_pass` é resolvido uma única vez, na subida do
        # nginx, e o IP fica em cache pelo resto da vida do processo. Como o
        # `web-cd` sobe uma vez e fica meses no ar, todo `docker compose up -d
        # --build app-cd` dava IP novo ao PHP-FPM e o nginx seguia falando com o
        # IP morto: 502 no site inteiro até alguém reiniciar o nginx à mão
        # (2026-08-24). Com o resolver do Docker e o alvo numa variável, a
        # resolução volta a acontecer por requisição, respeitando o `valid=10s`.
        # Mesmo padrão que o price.conf já usava para o price-researcher.
        resolver 127.0.0.11 valid=10s;
        set $upstream_app app-cd:9000;
        fastcgi_pass $upstream_app;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=50M \n post_max_size=50M";
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
