# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name carcadeals.com www.carcadeals.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name carcadeals.com www.carcadeals.com;

    ssl_certificate     /etc/letsencrypt/live/carcadeals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carcadeals.com/privkey.pem;

    include /var/www/html/docker/nginx/snippets/laravel-app.conf;
}

# Interno: a mesma aplicação para os serviços da rede `sistema-estoque-cd`
# (price-researcher, chatbot), por `http://web-server-cd:8080`.
#
# A porta 8080 **não** é publicada no host (ver `ports` do web-cd no
# docker-compose.yml): só alcança este bloco quem está na mesma rede Docker.
# É isso que permite, depois, fechar as rotas de máquina no bloco público sem
# depender da faixa de IP da rede — que é `external` e não tem sub-rede fixa.
#
# HTTP puro de propósito: o tráfego não sai da máquina, e o certificado é do
# domínio público, não de `web-server-cd`.
server {
    listen 8080;
    server_name _;

    include /var/www/html/docker/nginx/snippets/laravel-app.conf;
}
