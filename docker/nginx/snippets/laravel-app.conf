# A aplicação Laravel, servida igual em todo `server` que a inclui: o público
# (https://carcadeals.com) e o interno (porta 8080, só na rede Docker). Um
# lugar só para o bloco do PHP, que carrega a correção do IP em cache abaixo.
#
# Incluído pelo caminho do projeto (`/var/www/html/docker/...`), que o web-cd já
# monta: sem volume novo, o arquivo chega com o `git pull` e o container sobe
# mesmo reiniciado antes de alguém recriá-lo. Fora de `public/`, não é servido.

root /var/www/html/public;

add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";

index index.php;

charset utf-8;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

error_page 404 /index.php;

location ~ \.php$ {
    # Nome literal em `fastcgi_pass` é resolvido uma única vez, na subida do
    # nginx, e o IP fica em cache pelo resto da vida do processo. Como o
    # `web-cd` sobe uma vez e fica meses no ar, todo `docker compose up -d
    # --build app-cd` dava IP novo ao PHP-FPM e o nginx seguia falando com o
    # IP morto: 502 no site inteiro até alguém reiniciar o nginx à mão
    # (2026-08-24). Com o resolver do Docker e o alvo numa variável, a
    # resolução volta a acontecer por requisição, respeitando o `valid=10s`.
    # Mesmo padrão que o price.conf já usava para o price-researcher.
    resolver 127.0.0.11 valid=10s;
    set $upstream_app app-cd:9000;
    fastcgi_pass $upstream_app;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_param PHP_VALUE "upload_max_filesize=50M \n post_max_size=50M";
    # Por qual porta a requisição entrou (`set $estoque_entry` em cada server):
    # o InternalNetworkOnly fecha as rotas de máquina na entrada `public`.
    fastcgi_param ESTOQUE_ENTRY $estoque_entry;
    fastcgi_read_timeout 300;
}

location ~ /\.(?!well-known).* {
    deny all;
}
