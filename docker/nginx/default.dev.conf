server {
    listen 80;
    server_name localhost;

    include /var/www/html/docker/nginx/snippets/laravel-app.conf;
}

# Interno, como em produção (ver default.conf): a aplicação para os serviços da
# rede `sistema-estoque-cd`, por `http://web-server-cd:8080`, sem publicar a porta.
server {
    listen 8080;
    server_name _;

    include /var/www/html/docker/nginx/snippets/laravel-app.conf;
}
