server {
    listen 80;
    server_name price.carcadeals.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name price.carcadeals.com;

    ssl_certificate     /etc/letsencrypt/live/price.carcadeals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/price.carcadeals.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        proxy_pass http://price-researcher:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}