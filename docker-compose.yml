networks:
  sistema-estoque-cd:
    name: sistema-estoque-cd
    # A rede é compartilhada com o price-cd (que a consome como external).
    # Sem `external: true` aqui, este projeto vira dono dela e um
    # `docker compose down` a destrói, deixando os containers parados do
    # price-cd apontando para um ID de rede que não existe mais.
    # Criar uma vez por máquina: docker network create sistema-estoque-cd
    external: true

services:
  app-cd:
    container_name: app-cd
    # `unless-stopped`, e não `always` como os irmãos: um `docker stop app-cd`
    # deliberado — o jeito de estancar uma emergência sem derrubar banco e nginx
    # junto — precisa continuar valendo depois de um restart do daemon. Até
    # 2026-08-24 este era o único serviço sem política nenhuma, e um reboot
    # deixava o site em 502 até alguém subir o container à mão.
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres-cd
      - redis-cd
    networks:
      - sistema-estoque-cd
    ports:
      # Só o Vite dev server usa esta porta. Publicada no loopback porque em
      # produção o entrypoint não sobe o Vite, e um dev server exposto serve o
      # código-fonte do projeto para quem alcançar a porta.
      - "127.0.0.1:5173:5173" # Vite HMR (dev)
    environment:
      # Fallback do ambiente e fonte do `$_SERVER['APP_ENV']` que o phpunit.xml
      # precisa sobrescrever (ver docs/agents/testing.md). Quem decide entre
      # `npm run dev` e `npm run build` é o `.env`, lido pelo entrypoint via
      # docker/resolve-app-env.sh — esta variável só vale se o arquivo não
      # declarar `APP_ENV`. Foi essa divergência que derrubou a VPS em
      # 2026-08-24: o Compose não interpolou aqui, o shell caiu em `local` e a
      # produção subiu o Vite dev server enquanto o Laravel rodava `production`.
      - APP_ENV=${APP_ENV:-local}
    entrypoint: /usr/local/bin/entrypoint.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres-cd:
    container_name: db-cd
    image: postgres:15
    restart: always
    volumes:
      - ./docker/postgres/data-cd:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - sistema-estoque-cd

  redis-cd:
    container_name: redis-cd
    image: redis:7-alpine
    restart: always
    networks:
      - sistema-estoque-cd

  web-cd:
    container_name: web-server-cd
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "170:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/price.conf:/etc/nginx/conf.d/price.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app-cd
    networks:
      - sistema-estoque-cd
