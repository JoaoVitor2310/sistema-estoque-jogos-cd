networks:
  sistema-estoque-cd:
    name: sistema-estoque-cd

services:
  app-cd:
    container_name: app-cd
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres-cd
      - redis-cd
    networks:
      - sistema-estoque-cd
    ports:
      # Só o Vite dev server usa esta porta. Publicada no loopback porque em
      # produção o entrypoint não sobe o Vite, e um dev server exposto serve o
      # código-fonte do projeto para quem alcançar a porta.
      - "127.0.0.1:5173:5173" # Vite HMR (dev)
    environment:
      # O entrypoint decide entre `npm run dev` e `npm run build` por esta
      # variável, e ela precisa existir no ambiente do container — o `.env` do
      # Laravel é lido pelo PHP, não pelo shell. Sem isto o default é `local` e
      # a produção sobe o Vite dev server, que grava `public/hot` e faz o Blade
      # apontar os assets para `localhost:5173`: a página carrega e nunca monta.
      - APP_ENV=${APP_ENV:-local}
    entrypoint: /usr/local/bin/entrypoint.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres-cd:
    container_name: db-cd
    image: postgres:15
    restart: always
    volumes:
      - ./docker/postgres/data-cd:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - sistema-estoque-cd

  redis-cd:
    container_name: redis-cd
    image: redis:7-alpine
    restart: always
    networks:
      - sistema-estoque-cd

  web-cd:
    container_name: web-server-cd
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "170:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/price.conf:/etc/nginx/conf.d/price.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app-cd
    networks:
      - sistema-estoque-cd
